[package]
name = "powercfg"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Daniel Weiner"]
description = "Linux equivalent of Windows powercfg command"
repository = "https://github.com/danweinerdev/powercfg"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
wait-timeout = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
insta = "1"
