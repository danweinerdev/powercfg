[package]
name = "powercfg"
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Daniel Weiner"]
description = "Linux equivalent of Windows powercfg command"
repository = "https://github.com/danweinerdev/powercfg"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
wait-timeout = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
insta = { version = "1", features = ["json", "redactions"] }

# Release profile: strip symbols and apply thin LTO so `make release` ships
# a small, optimized binary. `codegen-units = 1` trades build time for size.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
