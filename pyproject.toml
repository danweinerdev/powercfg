[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powercfg"
version = "1.0.0"
description = "Linux equivalent of Windows powercfg command"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Daniel Weiner"}
]
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Power (UPS)",
]
keywords = ["power", "sleep", "suspend", "hibernate", "linux", "powercfg"]

[project.scripts]
powercfg = "powercfg:main"

[project.urls]
Homepage = "https://github.com/danweinerdev/powercfg"
Repository = "https://github.com/danweinerdev/powercfg"
Issues = "https://github.com/danweinerdev/powercfg/issues"

[tool.setuptools]
py-modules = ["powercfg"]
